name: 테스트 커버리지

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: 패키지 테스트 (${{ matrix.package }})
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        package: [MenuBarModel, ThawConcurrency, ThawLayout, ThawAX, ThawCapture, ThawUI]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 패키지 테스트와 커버리지 측정
        run: |
          swift test --package-path "upstream/${{ matrix.package }}" \
            --scratch-path "build/PackageTests/${{ matrix.package }}" \
            --disable-xctest --enable-code-coverage --skip-update

      - name: UI 의존성 revision 확인
        if: matrix.package == 'ThawUI'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def revision(path):
              pins = json.loads(Path(path).read_text())["pins"]
              return next(pin["state"]["revision"] for pin in pins if pin["identity"] == "compactslider")

          app = revision("upstream/Thaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved")
          package = revision("upstream/ThawUI/Package.resolved")
          if app != package:
              raise SystemExit("앱과 패키지의 CompactSlider revision이 다릅니다")
          PY

      - name: 패키지 커버리지 보고서 보관
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-coverage-${{ matrix.package }}
          path: build/PackageTests/${{ matrix.package }}/**/codecov/*.json
          if-no-files-found: error
          retention-days: 7

  coverage:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 정책 테스트와 서명 회귀 검사
        run: ./test.command

      - name: SwiftLint 준비
        run: |
          sh upstream/scripts/install-swiftlint.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 앱 테스트와 커버리지 측정
        run: |
          xcodebuild test \
            -project upstream/Thaw.xcodeproj \
            -scheme Thaw \
            -destination 'platform=macOS' \
            -derivedDataPath build/Coverage \
            -resultBundlePath build/Coverage.xcresult \
            -enableCodeCoverage YES \
            DISABLE_DIAMOND_PROBLEM_DIAGNOSTIC=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Sonar 커버리지 보고서 생성
        run: |
          set -euo pipefail
          toolDir="$RUNNER_TEMP/neat-coverage-tools"
          mkdir -p "$toolDir"
          curl -fsSL --retry 3 \
            https://github.com/a7ex/xcresultparser/releases/download/2.0.1/xcresultparser.zip \
            -o "$toolDir/xcresultparser.zip"
          echo "0af7cadc7d77431fab6fd15c3382ebcb35ea48881172aa780a43b757edfec1b7  $toolDir/xcresultparser.zip" | shasum -a 256 -c -
          unzip -q "$toolDir/xcresultparser.zip" -d "$toolDir"
          "$toolDir/product/xcresultparser" -c -o xml build/Coverage.xcresult > build/coverage.xml
          python3 upstream/scripts/normalize-coverage.py build/coverage.xml "$GITHUB_WORKSPACE/upstream"

      - name: 커버리지 보고서 보관
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: build/coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: SonarQube Cloud 분석
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: upstream
          args: -Dsonar.coverageReportPaths=../build/coverage.xml
